<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>fantasy football probability</title>
<style>
:root{--fg:#000;--bg:#fff;--mute:#666;--line:#000;--soft:#ddd}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow-x:hidden;padding:12px 16px 40px;background:var(--bg);color:var(--fg);font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
h1{font-size:13px;margin:0;font-weight:700;display:inline}
header{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px}
header .m{color:var(--mute)}
label{cursor:pointer}
button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:1px 6px;cursor:pointer}
button:hover{background:#000;color:#fff}
a{color:var(--fg)}
#wp{display:block;width:100%;margin:12px 0;padding:10px 6px;font-size:clamp(16px,5vw,22px);font-weight:700;text-align:center;border:1px solid var(--line)}
#wp small{display:block;font-size:12px;font-weight:400;margin-top:4px}
#teams{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
#teams>section,.grid2>*{min-width:0}
@media (max-width:980px){#teams{grid-template-columns:minmax(0,1fr)}}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:2px 4px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--soft)}
th{border-bottom:1px solid var(--line);font-weight:700}
td.n,th.n{text-align:right}
tr.be td{color:#222}
tr.sep td{border-bottom:1px solid var(--line);padding:0}
td.pc>div{display:flex;align-items:center;gap:2px}
td.pc .tag{white-space:nowrap}
input[list]{font:inherit;flex:1 1 auto;width:100%;min-width:150px;border:1px solid var(--soft);padding:1px 3px;background:var(--bg);color:var(--fg)}
input[list]:focus,input.f:focus{outline:1px solid #000}
input.f{font:inherit;width:52px;border:1px solid var(--soft);padding:1px 3px;text-align:right}
.tag{font-size:11px;padding:0 3px;border:1px solid var(--line);margin-left:3px}
.mute{color:var(--mute)}
.h2{font-weight:700;margin:18px 0 6px;border-bottom:1px solid var(--line);padding-bottom:2px;display:flex;justify-content:space-between}
#panel{margin-top:8px}
svg{display:block;width:100%;height:auto;margin:4px 0}
svg text{font:11px ui-monospace,Menlo,monospace;fill:#000}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:18px}
.pick{cursor:pointer}
.pick:hover td{background:#f2f2f2}
.best td{font-weight:700}
.x{float:right}
</style>
</head>
<body>
<header>
  <h1>fantasy football probability</h1>
  <span id="wk" class="m"></span>
  <span>scoring:
    <label><input type="radio" name="fmt" value="0" checked> PPR</label>
    <label><input type="radio" name="fmt" value="1"> Half</label>
    <label><input type="radio" name="fmt" value="2"> Std</label>
  </span>
  <span id="built" class="m"></span>
</header>
<button id="wp" type="button" title="click for the full statistics">enter both lineups<small>&nbsp;</small></button>
<div id="teams">
  <section><div class="h2"><span>YOUR TEAM</span><span><span id="sumA" class="mute"></span> <button data-clear="A" type="button">clear</button></span></div><div class="tw"><table id="tA"></table></div></section>
  <section><div class="h2"><span>OPPONENT</span><span><span id="sumB" class="mute"></span> <button data-clear="B" type="button">clear</button></span></div><div class="tw"><table id="tB"></table></div></section>
</div>
<div id="panel"></div>
<div id="dls"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
